name: Android · Play Store

# El PREFIJO del tag decide el canal:
#   android-v*    → prueba INTERNA (testers)
#   produccion-*  → PRODUCCIÓN, LIVE 100% (publica al instante — usar con cuidado)
# También a mano (workflow_dispatch) eligiendo el track.
# NO corre en cada push a master (para no gastar builds ni subir sin querer).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Canal de Play Store"
        required: true
        default: "internal"
        type: choice
        options: [internal, production]
  push:
    tags:
      - "android-v*"
      - "produccion-*"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: el versionCode se calcula contando commits, y con
          # el checkout somero (por defecto) siempre daría 1.
          fetch-depth: 0

      # Resuelve el track de Play desde el prefijo del tag o del input manual.
      - name: Determinar canal
        id: canal
        run: |
          if [ -n "${{ github.event.inputs.track }}" ]; then
            TRACK="${{ github.event.inputs.track }}"
          else
            case "${GITHUB_REF_NAME}" in
              produccion-*) TRACK="production" ;;
              android-v*)   TRACK="internal" ;;
              *) echo "::error::Tag '${GITHUB_REF_NAME}' no coincide con android-v* ni produccion-*"; exit 1 ;;
            esac
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Canal de Play: $TRACK (ref ${GITHUB_REF_NAME})"

      # El versionCode y el versionName salen DEL TAG, no del build.gradle.kts.
      #
      # Antes había que editar el archivo a mano antes de cada release, y eso es
      # justo lo que se olvida: subir el tag con el versionCode viejo hace que
      # Play RECHACE el .aab ("versionCode ya usado"), o peor, que se publique
      # anunciando un número que no corresponde.
      #
      # versionName = lo que sigue a "v" en el tag (produccion-v2.9.16 → 2.9.16).
      # versionCode = el del archivo + 1. Se prefiere a contar commits porque
      # mantiene la numeración corta y pegada a la de Play (47, 48, 49…) en vez
      # de saltar a cientos, que vuelve ilegible la correspondencia.
      # El commit con el número nuevo se devuelve a master al final del workflow,
      # así el archivo nunca se queda atrás del release publicado.
      - name: Calcular versión desde el tag
        id: version
        run: |
          NOMBRE="${GITHUB_REF_NAME#*v}"
          if [ -z "$NOMBRE" ] || [ "$NOMBRE" = "${GITHUB_REF_NAME}" ]; then
            # workflow_dispatch (sin tag): se respeta lo que diga el archivo.
            echo "Sin tag con versión: se usa la del build.gradle.kts."
            echo "aplicar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTUAL=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' composeApp/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          CODE=$((ACTUAL + 1))
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $CODE/" composeApp/build.gradle.kts
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$NOMBRE\"/" composeApp/build.gradle.kts
          echo "aplicar=si" >> "$GITHUB_OUTPUT"
          echo "Versión de este release: $NOMBRE ($CODE)"
          grep -E 'versionCode|versionName' composeApp/build.gradle.kts | tail -2

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Reconstruye el keystore de firma desde secrets (nunca vive en el repo).
      # KEYSTORE_BASE64 = el .jks codificado en base64.
      - name: Restaurar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > sania-release.jks
          cat > keystore.properties <<EOF
          storeFile=sania-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar AAB de release (firmado)
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:bundleRelease

      # Ruby + Bundler con caché. Instala Fastlane vía Gemfile sin problemas de
      # permisos (a diferencia de 'gem install' global, que falla en el runner).
      - name: Instalar Fastlane (Ruby + bundler)
        # Pineado a SHA (seguridad): ruby/setup-ruby v1.207.0
        uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # La cuenta de servicio de Google Play. Se pasa en BASE64 para que la private_key
      # (con sus \n) no se corrompa al guardarla como secret — la corrupción causa
      # "Invalid JWT Signature". El secret PLAY_STORE_JSON_KEY_B64 = base64 del .json.
      - name: Restaurar clave de Google Play
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_STORE_JSON_KEY_B64 }}
        run: echo "$PLAY_JSON_B64" | base64 -d > play-store-key.json

      - name: Subir a Play Store
        env:
          PLAY_STORE_JSON_KEY_PATH: play-store-key.json
          TRACK: ${{ steps.canal.outputs.track }}
        run: bundle exec fastlane android "$TRACK"

      # Actualiza en Vercel la ÚLTIMA versión disponible (APP_ANDROID_LATEST) al versionCode
      # recién subido → el endpoint /api/app/version la sirve y la app muestra el popup
      # "nueva versión disponible" sin que nadie toque Vercel a mano.
      # Requiere secrets: VERCEL_TOKEN y VERCEL_PROJECT_ID (ver docs/ci-cd-despliegue.md).
      # Se salta silenciosamente si los secrets no están configurados (no rompe el deploy).
      # OJO: antes decía `!= 'production'` — o sea que se saltaba JUSTO en el
      # release de producción, que es cuando hace falta. Resultado: se publicaba
      # la v45 en Play y el endpoint seguía anunciando la 39, así que a nadie le
      # aparecía el aviso de nueva versión (2026-08-11).
      # Devuelve a master el versionCode nuevo. Sin esto el archivo se queda con
      # el número viejo y el SIGUIENTE release calcularía el mismo → Play lo
      # rechaza por versionCode repetido.
      - name: Guardar la versión nueva en master
        if: ${{ steps.version.outputs.aplicar == 'si' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composeApp/build.gradle.kts
          git diff --cached --quiet && { echo "Sin cambios que guardar."; exit 0; }
          git commit -m "chore(release): versionCode de ${GITHUB_REF_NAME} [skip ci]"
          # El tag apunta a un commit de master; se empuja ahí, no al tag.
          git push origin HEAD:master

      - name: Actualizar versión en Vercel (popup de actualización)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN/VERCEL_PROJECT_ID no configurados — se omite (config manual)."
            exit 0
          fi
          # versionCode del build.gradle.kts (la línea 'versionCode = N').
          VC=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' composeApp/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          echo "Actualizando APP_ANDROID_LATEST = $VC en Vercel…"
          # 1) Buscar el id de la env var existente (si existe) para actualizarla.
          ENV_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            | grep -o '"id":"[^"]*","key":"APP_ANDROID_LATEST"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$ENV_ID" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
              -d "{\"value\":\"$VC\"}" > /dev/null && echo "✓ actualizada."
          else
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
              -d "{\"key\":\"APP_ANDROID_LATEST\",\"value\":\"$VC\",\"type\":\"plain\",\"target\":[\"production\"]}" > /dev/null && echo "✓ creada."
          fi
          # Vercel CONGELA las env vars al momento del deploy: cambiar la var NO afecta al
          # deployment vivo hasta un nuevo deploy. El Deploy Hook re-despliega producción
          # con el valor fresco → el endpoint /api/app/version pasa a servir el nuevo número.
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "✓ redeploy de la web disparado (deploy hook)."
          else
            echo "⚠ VERCEL_DEPLOY_HOOK no configurado — la var quedó guardada pero el popup NO se activa hasta el próximo deploy de la web. Configúralo (ver docs/ci-cd-despliegue.md)."
          fi

      # Limpieza: borra los secretos materializados aunque el job falle.
      - name: Limpiar secretos del runner
        if: always()
        run: rm -f sania-release.jks keystore.properties play-store-key.json
